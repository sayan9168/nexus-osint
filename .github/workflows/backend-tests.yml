name: NEXUS-OSINT CI
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest pip-audit
      - name: Compile
        run: python -m compileall -q .
      - name: Tests
        run: pytest -q
      - name: Dependency audit
        run: pip-audit -r requirements.txt
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Build
        run: npm run build
      - name: Audit (non-blocking)
        run: npm audit --audit-level=high || true
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker build -t nexus-osint-backend ./backend
      - name: Build frontend image
        run: docker build -t nexus-osint-frontend ./frontend
