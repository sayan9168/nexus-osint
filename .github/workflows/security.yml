name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Requires the repository dependency graph (Settings → Code security).
    # Keep it non-blocking so a repo setting cannot turn every PR red; the
    # scheduled `audits` job below is the hard gate for advisories.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  audits:
    name: dependency audits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt --progress-spinner off

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit npm dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

  # The agent service pins a heavy ML stack (langchain/langgraph/transformers).
  # Auditing it is advisory for now: upgrading those majors is a separate,
  # tested migration tracked in docs/CI.md, so it never blocks a PR.
  agent-audit:
    name: agent audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Audit agent dependencies (report only)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r agent/requirements.txt --progress-spinner off -f json -o agent-audit.json || true
          pip-audit -r agent/requirements.txt --progress-spinner off || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-dependency-audit
          path: agent-audit.json
          if-no-files-found: ignore
          retention-days: 14
