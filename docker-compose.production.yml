services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [redis, memgraph]
  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    command: celery -A osint_core.jobs worker --loglevel=INFO --concurrency=2
    depends_on: [redis]
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports: ["3000:3000"]
    depends_on: [backend]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
  memgraph:
    image: memgraph/memgraph:latest
    restart: unless-stopped
    ports: ["7687:7687"]
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports: ["6333:6333"]
