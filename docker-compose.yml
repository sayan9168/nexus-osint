version: "3.9"

services:
  # ─── Memgraph (In-Memory Graph DB) ───
  memgraph:
    image: memgraph/memgraph-platform:2.18.0
    container_name: nexus-memgraph
    ports:
      - "7687:7687"
      - "7444:7444"
      - "3000:3000"
    volumes:
      - memgraph_data:/var/lib/memgraph
      - ./docker/memgraph/init.cypher:/docker-entrypoint-initdb.d/init.cypher
    environment:
      - MEMGRAPH=--log-level=WARNING
    healthcheck:
      test: ["CMD", "mgconsole", "--execute", "RETURN 1;"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-net

  # ─── Redis (Cache + Celery Broker) ───
  redis:
    image: redis:7.2-alpine
    container_name: nexus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - nexus-net

  # ─── Qdrant (Vector DB) ───
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: nexus-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - nexus-net

  # ─── FastAPI Backend ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-backend
    ports:
      - "8000:8000"
    environment:
      - MEMGRAPH_HOST=memgraph
      - MEMGRAPH_PORT=7687
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://localhost:11434/v1}
    depends_on:
      memgraph:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --workers 4
    networks:
      - nexus-net

  # ─── Celery Worker ───
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-celery-worker
    environment:
      - MEMGRAPH_HOST=memgraph
      - MEMGRAPH_PORT=7687
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
    depends_on:
      - redis
      - memgraph
    volumes:
      - ./backend:/app
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=8 --pool=prefork
    networks:
      - nexus-net

  # ─── Celery Beat (Scheduler) ───
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-celery-beat
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - redis
    volumes:
      - ./backend:/app
    command: celery -A workers.celery_app beat --loglevel=info
    networks:
      - nexus-net

  # ─── AI Agent Service ───
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: nexus-agent
    ports:
      - "8001:8001"
    environment:
      - BACKEND_URL=http://backend:8000
      - MEMGRAPH_HOST=memgraph
      - MEMGRAPH_PORT=7687
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://localhost:11434/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:72b}
    depends_on:
      - backend
      - memgraph
      - qdrant
    volumes:
      - ./agent:/app
    command: python recon_agent.py
    networks:
      - nexus-net

  # ─── Next.js Frontend ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks:
      - nexus-net

volumes:
  memgraph_data:
  redis_data:
  qdrant_data:

networks:
  nexus-net:
    driver: bridge
