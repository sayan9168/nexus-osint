        :root {
            --primary: #00f0ff;
            --primary-dim: #00a8b3;
            --secondary: #7b2fff;
            --accent: #ff006e;
            --success: #00ff88;
            --warning: #ffbe0b;
            --bg-dark: #020810;
            --bg-surface: #0a1628;
            --bg-card: #0d1f3c;
            --bg-elevated: #132a4a;
            --text-primary: #e8f4f8;
            --text-secondary: #8ba4b8;
            --text-muted: #4a6a80;
            --border: #1a3a5c;
            --glow-primary: 0 0 20px rgba(0, 240, 255, 0.3);
            --glow-secondary: 0 0 20px rgba(123, 47, 255, 0.3);
            --glow-accent: 0 0 20px rgba(255, 0, 110, 0.3);
            --font-display: 'Orbitron', sans-serif;
            --font-heading: 'Rajdhani', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --font-body: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-dim) var(--bg-dark);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--primary-dim); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        body {
            font-family: var(--font-body);
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
